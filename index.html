<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pokémon Azul</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#202020;font-family:Arial,sans-serif}body{display:flex;justify-content:center;padding:8px}.shell{width:min(1100px,100%);background:#b8b8b8;border-radius:18px;padding:10px;box-shadow:0 12px 35px #0008}.logo{font-weight:900;font-size:clamp(20px,4vw,34px);text-align:center;color:#193a75;text-shadow:2px 2px #fff;margin:0 0 5px}.screen{background:#111;border-radius:10px;padding:6px;display:flex;align-items:center;justify-content:center;min-height:0}#game{width:100%;height:min(78vh,760px)}.controls{display:flex;justify-content:center;gap:7px;margin-top:5px}.tiny{border:0;border-radius:5px;padding:3px 7px;font-size:10px;line-height:1;background:#193a75;color:#fff;font-weight:700;cursor:pointer;box-shadow:0 2px 0 #0e2449}.tiny:active{transform:translateY(2px);box-shadow:0 0 #0e2449}.hint{text-align:center;color:#222;font-size:10px;margin-top:5px}
#fullscreenBtn{position:fixed!important;top:7px!important;right:7px!important;z-index:99999!important;padding:3px 5px!important;border:0!important;border-radius:5px!important;background:#222!important;color:#fff!important;font-size:9px!important;line-height:1!important;font-weight:700!important;cursor:pointer!important}
.menu-btn{width:auto;min-width:90px;margin:24px auto 0;padding:6px 8px;font-size:10px;border-radius:6px;display:block}
</style>
<script>window.EJS_player="#game";window.EJS_core="gb";window.EJS_gameUrl="pokemon-azul.gb";window.EJS_pathtodata="https://cdn.emulatorjs.org/stable/data/";window.EJS_language="es-419";window.EJS_Buttons={settings:{visible:true},saveState:{visible:true},loadState:{visible:true}};</script><script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script></head>
<body><main class="shell"><div class="logo">POKÉMON AZUL</div><div class="screen"><div id="game"></div></div><div class="controls"><button class="tiny" type="button" onclick="abrirMenuEmulador()">☰ MENÚ</button></div><div class="hint">Flechas · Z=A · X=B · Enter=Start · Shift=Select</div></main>
<button id="fullscreenBtn" type="button">⛶ FULL</button>
<script>function abrirMenuEmulador(){const root=document.getElementById('game');for(const el of root.querySelectorAll('button,[role="button"],div')){const l=((el.getAttribute('aria-label')||'')+' '+(el.getAttribute('title')||'')+' '+(el.textContent||'')).toLowerCase();if(l.includes('settings')||l.includes('configuración')||l.includes('ajustes')||l.includes('menu')){el.click();return}}document.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',code:'Escape',bubbles:true}));}
(function(){const b=document.getElementById('fullscreenBtn');function fs(){const e=document.documentElement,f=e.requestFullscreen||e.webkitRequestFullscreen||e.msRequestFullscreen;if(f){const p=f.call(e);if(p&&p.catch)p.catch(()=>{})}}b.onclick=fs;document.addEventListener('pointerdown',()=>fs(),{once:true});document.addEventListener('fullscreenchange',()=>b.textContent=document.fullscreenElement?'⛶ EXIT':'⛶ FULL')})();</script></body></html>
