<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pokémon Azul — Game Boy</title>
<style>
html,body{margin:0;min-height:100%;background:#202020;color:#eee;font-family:Arial,sans-serif}
body{display:flex;align-items:center;justify-content:center;padding:18px;box-sizing:border-box}
.shell{width:min(900px,100%);background:#b8b8b8;border-radius:24px;padding:22px;box-shadow:0 18px 50px #0008}
.logo{font-weight:900;font-size:clamp(24px,5vw,42px);text-align:center;color:#193a75;text-shadow:2px 2px #fff;margin-bottom:12px}
.screen{background:#111;border-radius:14px;padding:10px;min-height:520px;display:flex;align-items:center;justify-content:center}
#game{width:100%;height:520px}
.menu-btn{display:block;width:100%;margin:12px 0 0;padding:14px 18px;border:0;border-radius:12px;background:#193a75;color:#fff;font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 4px 0 #0e2449}
.menu-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0e2449}
.hint{text-align:center;color:#222;font-size:14px;margin-top:12px}
.note{text-align:center;color:#222;font-size:12px;margin-top:8px}
</style>
<script>
window.EJS_player="#game";
window.EJS_core="gb";
window.EJS_gameUrl="pokemon-azul.gb";
window.EJS_pathtodata="https://cdn.emulatorjs.org/stable/data/";
window.EJS_language="es-419";
// Hace visible el botón oficial de ajustes/menú de EmulatorJS en la barra del emulador.
window.EJS_Buttons={
  settings:{visible:true,displayName:"Menú del emulador"},
  saveState:{visible:true},
  loadState:{visible:true}
};
</script>
<script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

<style id="custom-layout">
  html, body {
    margin: 0 !important;
    padding: 0 !important;
    width: 100% !important;
    min-height: 100% !important;
    background: #111 !important;
  }
  #game, #emulator, #game-container, #emulator-container, .game-container {
    width: min(96vw, 1100px) !important;
    max-width: 1100px !important;
    margin: 0 auto !important;
  }
  #fullscreenBtn, #menuBtn, #openMenuBtn {
    padding: 6px 9px !important;
    font-size: 12px !important;
    line-height: 1.1 !important;
    border-radius: 7px !important;
  }
</style>

</head>
<body>

<button id="fullscreenBtn" type="button" style="position:fixed;top:10px;right:10px;z-index:99999;padding:6px 9px;border:0;border-radius:7px;background:#222;color:#fff;font-size:12px;font-weight:700;line-height:1.1;cursor:pointer;">⛶ FULL</button>
<script>
(function () {
  const btn = document.getElementById('fullscreenBtn');
  function enterFullscreen() {
    const el = document.documentElement;
    const fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if (fn) {
      const p = fn.call(el);
      if (p && p.catch) p.catch(() => {});
    }
  }
  btn.addEventListener('click', enterFullscreen);

  // Browsers require a user gesture for fullscreen. On the first click/tap
  // anywhere on the page, request fullscreen.
  let firstGesture = true;
  document.addEventListener('pointerdown', function () {
    if (firstGesture) {
      firstGesture = false;
      enterFullscreen();
    }
  }, {once:true});

  document.addEventListener('fullscreenchange', function () {
    btn.textContent = document.fullscreenElement ? '⛶ SALIR DE PANTALLA COMPLETA' : '⛶ PANTALLA COMPLETA';
  });
})();
</script>

<main class="shell">
  <div class="logo">POKÉMON AZUL</div>
  <div class="screen"><div id="game"></div></div>
  <button class="menu-btn" type="button" onclick="abrirMenuEmulador()">☰ MENÚ</button>
  <div class="hint">Teclado: flechas · Z = A · X = B · Enter = Start · Shift = Select</div>
  <div class="note">El botón de arriba y el botón ⚙️ del emulador abren las opciones, incluyendo Save State y Load State.</div>
</main>
<script>
function abrirMenuEmulador(){
  // El botón oficial "settings" de EmulatorJS queda visible en la barra del emulador.
  // Este botón externo intenta enfocarlo/clicarlo cuando está disponible.
  const root=document.getElementById('game');
  const candidates=root.querySelectorAll('button,[role="button"],div');
  for(const el of candidates){
    const label=((el.getAttribute('aria-label')||'')+' '+(el.getAttribute('title')||'')+' '+(el.textContent||'')).toLowerCase();
    if(label.includes('settings')||label.includes('configuración')||label.includes('ajustes')||label.includes('menu')){
      el.click(); return;
    }
  }
  alert('Si el menú no se abrió, usa el botón ⚙️/☰ de la barra del emulador. Ahí encontrarás Save State y Load State.');
}
</script>
</body>
</html>
